

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="55%" stop-color="#260D19"/>
      <stop offset="100%" stop-color="#451126"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D"/>
      <stop offset="50%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#701A3D"/>
      <animate attributeName="x1" values="-1;1;-1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity=".08"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>

  <circle cx="950" cy="175" r="190" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="r" values="160;205;160" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="#C77B9B" stroke-opacity=".35">
    <circle cx="970" cy="180" r="120" stroke-dasharray="4 12"/>
    <circle cx="970" cy="180" r="155" stroke-dasharray="2 16"/>
    <ellipse cx="970" cy="180" rx="205" ry="75" transform="rotate(-28 970 180)" stroke-opacity=".25"/>
  </g>

  <circle cx="970" cy="60" r="5" fill="#E5B5C7">
    <animateMotion dur="9s" repeatCount="indefinite" path="M0 0 A120 120 0 1 1 0 1"/>
  </circle>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="95" fill="#C77B9B" font-size="15" letter-spacing="5">HELLO, WORLD • WELCOME TO MY PROFILE</text>

    <text x="88" y="177" fill="#F8F0F3" font-size="58" font-weight="bold">ANJALI KUMARI</text>

    <text x="92" y="220" fill="#E5B5C7" font-size="22" letter-spacing="2">FULL STACK DEVELOPER</text>

    <text x="92" y="260" fill="#C9AAB7" font-size="16">Computer Science Student • IIT Patna • India</text>

    <path d="M92 288 H520" stroke="url(#shine)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 430;430 0;0 430" dur="5s" repeatCount="indefinite"/>
    </path>

    <text x="92" y="326" fill="#C77B9B" font-size="13" letter-spacing="4">BUILD • CREATE • INNOVATE</text>
  </g>

  <path d="M0 350 Q300 320 600 355 T1200 340" fill="none" stroke="#701A3D" stroke-width="2" opacity=".7">
    <animate attributeName="d" values="M0 350 Q300 320 600 355 T1200 340;M0 340 Q300 370 600 335 T1200 350;M0 350 Q300 320 600 355 T1200 340" dur="8s" repeatCount="indefinite"/>
  </path>

  <rect x="1" y="1" width="1198" height="378" rx="24" fill="none" stroke="#C77B9B" stroke-opacity=".35"/>
</svg>
