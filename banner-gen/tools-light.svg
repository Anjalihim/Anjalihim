  <text x="28" y="146" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" fill="#334155" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.45s" fill="freeze" />• Frontend &amp; Full-Stack: JavaScript, TypeScript, HTML5, CSS3, Tailwind CSS, React.js, Next.js,</text><text x="28" y="168" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" fill="#334155" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.45s" fill="freeze" />  Node.js, Express.js, MongoDB.</text><text x="28" y="196" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" fill="#334155" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.29s" dur="0.45s" fill="freeze" />• Data &amp; Analytics: Python, Pandas, NumPy, SQL, Power BI.</text><text x="28" y="224" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" fill="#334155" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.43s" dur="0.45s" fill="freeze" />• Developer Tools: Git, GitHub, VS Code.</text>
