  <rect x="28.0" y="96" width="80.8" height="24" rx="12" fill="#1E293B" stroke="#22D3EE" stroke-opacity="0.45" /><text x="68.4" y="112" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22D3EE">React.js</text><rect x="116.8" y="96" width="73.2" height="24" rx="12" fill="#1E293B" stroke="#22D3EE" stroke-opacity="0.45" /><text x="153.4" y="112" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22D3EE">Node.js</text><rect x="198.0" y="96" width="96.0" height="24" rx="12" fill="#1E293B" stroke="#22D3EE" stroke-opacity="0.45" /><text x="246.0" y="112" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22D3EE">Express.js</text><rect x="302.0" y="96" width="73.2" height="24" rx="12" fill="#1E293B" stroke="#22D3EE" stroke-opacity="0.45" /><text x="338.6" y="112" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22D3EE">MongoDB</text><rect x="383.2" y="96" width="96.0" height="24" rx="12" fill="#1E293B" stroke="#22D3EE" stroke-opacity="0.45" /><text x="431.2" y="112" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22D3EE">WebSockets</text>
